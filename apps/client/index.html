<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仙 Xian IO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="join-overlay">
      <div class="panel">
        <h1>仙 · เทพเซียน IO</h1>
        <p>ใส่ชื่อแล้วเข้าห้องฝึก (local MVP)</p>
        <input id="name-input" type="text" maxlength="24" placeholder="ชื่อนักบำเพ็ต" />
        <button id="join-btn" type="button">เข้าโลก</button>
      </div>
    </div>
    <div id="hud" class="hidden">
      <div id="stats"></div>
      <div id="leaderboard">
        <h2>อันดับนักบำเพ็ต</h2>
        <ol id="leaderboard-list"></ol>
      </div>
      <label id="sfx-toggle" class="sfx-toggle">
        <input id="sfx-mute" type="checkbox" />
        ปิดเสียง
      </label>
      <p class="hint">WASD · คลิก/Space โจมตี · Shift สกิล · C ท้าดวล · วงทอง FFA · วงแดงอสูร</p>
    </div>
    <div id="path-overlay" class="hidden" role="dialog" aria-modal="true">
      <div class="panel path-panel">
        <h2>สร้างฐานปราณ — เลือกสายวิชา</h2>
        <p class="path-note">เลือกครั้งเดียวในห้องนี้</p>
        <div id="path-choices" class="path-grid"></div>
      </div>
    </div>
    <div id="challenge-banner" class="hidden">
      <div class="panel challenge-panel">
        <p id="challenge-text"></p>
        <div class="challenge-actions">
          <button id="challenge-accept" type="button">ยอมดวล</button>
          <button id="challenge-decline" type="button">ปฏิเสธ</button>
        </div>
      </div>
    </div>
    <div id="toast" class="hidden" role="status"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
