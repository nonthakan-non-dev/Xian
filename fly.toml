# fly.toml app configuration file generated for xian on 2026-09-29T04:41:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xian'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLIENT_DIST = '/app/apps/client/dist'
  HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
